name: Release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching package.json and tauri.conf.json, with an optional v prefix'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sidex-release-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release versions
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release.mjs version

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            artifact_name: macos-x64
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_name: macos-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            artifact_name: windows-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libfuse2
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress --yes
          }
          nasm -version
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg
      - name: Install frontend dependencies
        run: npm ci
      - name: Stage pinned and verified Node.js runtime
        run: npm run stage:download-runtime -- ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: release-${{ matrix.target }}
      - name: Build and verify release artifacts
        timeout-minutes: 50
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release.mjs build ${{ matrix.target }} ${{ matrix.artifact_name }}
      - name: Upload architecture-specific artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sidex-${{ matrix.artifact_name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sidex-*
          path: all-artifacts
          merge-multiple: true
      - name: Protect existing releases and tag commits
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            let tag;
            try {
              tag = (await github.rest.git.getRef({
                ...context.repo, ref: `tags/${process.env.RELEASE_TAG}`
              })).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (let depth = 0; tag?.type === 'tag' && depth < 8; depth++) {
              tag = (await github.rest.git.getTag({
                ...context.repo, tag_sha: tag.sha
              })).data.object;
            }
            if (tag && (tag.type !== 'commit' || tag.sha !== context.sha)) {
              throw new Error('The existing release tag does not point to this workflow commit. Select that tag or use a new matching version.');
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              throw new Error('This tag already has a published release. Only draft releases may be created or updated.');
            }
      - name: Create or update a draft in this repository
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SideX ${{ needs.prepare.outputs.tag }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: all-artifacts/*
